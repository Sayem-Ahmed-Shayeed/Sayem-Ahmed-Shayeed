      <stop stop-color="#090B0B"/><stop offset="0.5" stop-color="#111513"/><stop offset="1" stop-color="#080A0A"/>
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(584 240) rotate(90) scale(260 430)">
      <stop stop-color="#B7FF38" stop-opacity="0.13"/><stop offset="1" stop-color="#B7FF38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#B7FF38" stop-opacity="0"/><stop offset="0.3" stop-color="#B7FF38" stop-opacity="0.32"/><stop offset="1" stop-color="#B7FF38" stop-opacity="0"/></linearGradient>
