    <g font-family="monospace" font-size="7" letter-spacing="1.1" fill="#B7FF38" opacity="0.28">
      <text x="-8" y="230">01001001 01101110 01110100 01100101 01110010 01110000 01110010 01100101 01110100</text><text x="-12" y="240">&gt;&gt; system.research() :: reliable_models :: local_first :: useful_software</text><text x="-18" y="250">00011100 01010101 11001010 00101100 01101001 10011010 00100111 01100001 01101100</text><text x="-8" y="260">function build(signal) { return clarity(signal).through(practice); }</text><text x="6" y="270">::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::</text><text x="12" y="280">git commit -m "make something dependable" // status: learning</text><text x="-10" y="290">10110001 01100100 00110010 01101111 01110000 01100101 01101110 01110011 01101111</text>
    </g>
    <g font-family="monospace" font-size="7" letter-spacing="1.1" fill="#B7FF38" opacity="0.25" text-anchor="end">
      <text x="1210" y="250">11010011 01100100 01100001 01110100 01100001 00101110 01101100 01101001 01100110 01100101</text><text x="1220" y="260">model.predict() :: explain() :: calibrate() :: repeat()</text><text x="1215" y="270">00101100 01110100 01110010 01110101 01110011 01110100 00101100 01110010 01100101</text><text x="1220" y="280">const future = buildWithCare(people, problems, patience);</text><text x="1210" y="290">::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::</text><text x="1215" y="300">$ ./ship --quietly --usefully --with-tests</text>
    </g>
    <rect y="197" width="405" height="120" fill="url(#fadeLeft)" opacity="0.35"/><rect x="795" y="205" width="405" height="120" fill="url(#fadeRight)" opacity="0.3"/>

    <g text-anchor="middle"><text x="600" y="174" fill="#A4AFA5" font-family="monospace" font-size="10" letter-spacing="4">[ THE FUTURE OF GITHUB PROFILES ]</text><text x="600" y="254" fill="#F7F4EC" font-family="Georgia, 'Times New Roman', serif" font-size="51" letter-spacing="-1.5">Build <tspan fill="#B7FF38" font-style="italic">Reliable</tspan> Systems.</text><text x="600" y="310" fill="#F7F4EC" font-family="Georgia, 'Times New Roman', serif" font-size="51" letter-spacing="-1.5">Study Useful Intelligence.</text><text x="600" y="344" fill="#A4AFA5" font-family="Arial, sans-serif" font-size="12">Research, engineering, and calm software for problems that matter.</text><text x="600" y="362" fill="#A4AFA5" font-family="Arial, sans-serif" font-size="12">A personal profile by Sayem Ahmed Shayeed.</text></g>

